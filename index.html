    <script>
        function toggleFilterVisibility() {
            const set = document.querySelector("#filter-set")

            set.classList.toggle("hidden")
        }

        function deleteRow(row) {
            fetch("/api/delete", {
                headers: {
                    "Content-Type": "application/json"
                },
                method: "POST",
                body: JSON.stringify({
                    target: row
                })
            }).then(e => e.text()).then(e => {
                console.log(e)
                update()
            }).catch(e => {
                console.log(e)
            })
        }
        function update() {

            const table = document.querySelector("table")
            const cabecalho = document.createElement("tr")
            cabecalho.innerHTML = `
                <th>posição</th>
                <th>id</th>
                <th>nome</th>
                <th>condição</th>
                <th>prioridade</th>
               <!-- <th>date</th> -->
                <th>ações</th>
            `
            table.replaceChildren(cabecalho)
            console.log(document.URL)
            let paramString = document.URL.split('?')[1];
            // let queryString = new URLSearchParams(paramString)
            // console.log(queryString)
            fetch(`/api/read?${paramString}`).then(e => e.json()).then(e => {

                console.log(e)
                e.forEach((i, j) => {
                    const tr = document.createElement("tr")
                    tr.innerHTML = `
                        <td>${i.position}</td>
                        <td>${i.id}</td>
                        <td>${i.name}</td>
                        <td>${i.condition}</td>
                        <td>${i.conditionPriority == 0 ? "urgente" : i.conditionPriority == 1 ? "intermediario" : "simples"}</td>
                        <!-- <td>${i.date}</td> -->
                        <td>
                            <button >
                                <a href="/create?id=${i.id}">
                                editar
                                </a>
                            </button>
                            <button onclick="deleteRow(${i.id})">
                                deletar
                            </button>    
                        </td>
                    `
                    table.appendChild(tr)
                })
            })
        }
        update()

        window.onload = () => {
            console.log("back")
        }
    </script>
